# One replica only: SQLite lives on a ReadWriteOnce volume that a single pod can write.
# "Recreate" stops the old pod before the new one starts, so two never share the database.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluxer-spanish
  labels:
    app: fluxer-spanish
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fluxer-spanish
  template:
    metadata:
      labels:
        app: fluxer-spanish
    spec:
      securityContext:
        # The image runs as the "node" user (1000); this lets it write to the volume.
        fsGroup: 1000
      containers:
        - name: web
          image: ghcr.io/fluxerdevs/fluxer-spanish:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4321
          envFrom:
            - secretRef:
                name: fluxer-spanish
          volumeMounts:
            - name: data
              mountPath: /app/.data
          readinessProbe:
            httpGet:
              path: /api/salud
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/salud
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fluxer-spanish-data
